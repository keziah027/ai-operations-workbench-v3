name: Regression and public demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Original desktop regression suite
        run: python -m unittest discover -s tests -v
        env:
          APP_MODE: local
          TOPIC_ENGINE: rules
      - name: Public demo acceptance suite
        run: python -m unittest discover -s cloud_tests -v
        env:
          APP_MODE: public
          TOPIC_ENGINE: rules
